[project]
name = "lupus-ex-machina"
version = "0.1.0"
description = "Werewolf simulator played by autonomous LLM agents"
# No `readme` on purpose: it lives outside this project directory, and the
# production image does not ship it. The package is never published anyway.
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    # Authenticated encryption for the provider keys kept on disk (D-113).
    # Writing one's own is the worst idea available; this is the standard.
    "cryptography>=46.0.4",
    "fastapi>=0.121.0",
    # The one HTTP client the project needs: asynchronous, and no proprietary
    # SDK anywhere near the models (D-043).
    "httpx2>=2.9.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
lupus-ex-machina = "lupus_ex_machina.server:main"
lupus-play = "lupus_ex_machina.play:main"
lupus-play-llm = "lupus_ex_machina.play_llm:main"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lupus_ex_machina"]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so that a helper shared by several test modules can
# live in `tests/support/` and be imported by name (R1.8).
pythonpath = ["src", "tests"]
filterwarnings = ["error"]
# The engine is asynchronous (D-087), so most of the suite is too. Auto mode
# spares every one of those tests a marker that would say nothing the `async def`
# does not already say.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=lupus_ex_machina",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["src/lupus_ex_machina"]
# `python -m lupus_ex_machina` is a three-line shim around server.main, which is
# unit tested; the shim itself is exercised end to end by scripts/check-image.sh.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

# --- Lint and format ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"] # test functions document themselves through their name

[tool.ruff.format]
docstring-code-format = true

# --- Type checking -----------------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
]
